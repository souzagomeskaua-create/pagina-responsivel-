<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Postagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="feed">
    <!-- Card de Postagem 1 -->
    <article class="card">
      <img src="https://via.placeholder.com/150" alt="Imagem da postagem" class="card-image">
      <div class="card-content">
        <h2>Título da Postagem 1</h2>
        <p>Este é o texto descritivo da postagem. Com o layout em linha, a imagem fica ao lado deste conteúdo.</p>
      </div>
      <button class="card-button">Ler mais</button>
    </article>

    <!-- Card de Postagem 2 -->
    <article class="card">
      <img src="https://via.placeholder.com/150" alt="Imagem da postagem" class="card-image">
      <div class="card-content">
        <h2>Título da Postagem 2</h2>
        <p>Outro exemplo de card horizontal ocupando toda a largura disponível da página.</p>
      </div>
      <button class="card-button">Ler mais</button>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
